name: Sync Upstream Files

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync cmliu/edgetunnel
    runs-on: ubuntu-latest

    steps:
      # 拉取自己的仓库
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 拉取上游仓库
      - name: Clone upstream repo
        run: |
          git clone --depth=1 https://github.com/cmliu/edgetunnel.git upstream

      # 同步所有文件，唯独排除 .github/workflows
      - name: Sync upstream files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            upstream/ ./

      # 提交同步结果
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync upstream latest changes"
          fi

      # 推送到你的仓库
      - name: Push changes
        run: |
          git push
